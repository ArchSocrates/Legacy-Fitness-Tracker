name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - name: Read version
        id: ver
        run: |
          echo "v=$(node -p "require('./version.json').version")" >> $GITHUB_OUTPUT
          node -p "require('./version.json').notes.map(n=>'- '+n).join('\n')" > notes.md
      - run: npm run build
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - name: Add Android project
        run: npx cap add android
      - name: Icon, permissions and version
        run: |
          node scripts/icons.mjs
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          F=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" $F
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.ver.outputs.v }}\"/" $F
      - name: Use the fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Legacy.apk
      - uses: actions/upload-artifact@v4
        with: { name: Legacy-apk, path: Legacy.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Legacy v${{ steps.ver.outputs.v }}
          body_path: notes.md
          files: Legacy.apk
          make_latest: true
