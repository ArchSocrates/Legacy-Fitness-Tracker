name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Add Android project
        run: npx cap add android
      - name: Use the fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: Set version
        run: |
          F=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" $F
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" $F
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Legacy.apk
      - uses: actions/upload-artifact@v4
        with: { name: Legacy-apk, path: Legacy.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Legacy build ${{ github.run_number }}
          files: Legacy.apk
          make_latest: true
