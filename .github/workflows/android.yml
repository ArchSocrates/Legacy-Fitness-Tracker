name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Read version
        id: ver
        run: |
          echo "v=$(node -p "require('./version.json').version")" >> $GITHUB_OUTPUT
          node -p "require('./version.json').notes.map(n=>'- '+n).join('\n')" > notes.md
      - run: npm run build
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
      - name: Add Android project
        run: npx cap add android
      - name: Icon, permissions, native code and version
        run: |
          node scripts/icons.mjs
          python3 scripts/manifest.py
          mkdir -p android/app/src/main/java/com/legacy/fitness
          cp native/java/*.java android/app/src/main/java/com/legacy/fitness/
          cp -r native/res/* android/app/src/main/res/
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle
          grep -n "minSdkVersion" android/variables.gradle
          F=android/app/build.gradle
          python3 - <<'PY'
          p='android/app/build.gradle'
          t=open(p).read()
          blk="android {\n    signingConfigs {\n        debug {\n            storeFile file('../../signing/debug.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n"
          assert "android {\n" in t
          open(p,'w').write(t.replace("android {\n",blk,1))
          PY
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" $F
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.ver.outputs.v }}\"/" $F
      - name: Use the fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Legacy-v${{ steps.ver.outputs.v }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Legacy-apk
          path: Legacy-v${{ steps.ver.outputs.v }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Legacy v${{ steps.ver.outputs.v }}
          body_path: notes.md
          files: Legacy-v${{ steps.ver.outputs.v }}.apk
          make_latest: true
