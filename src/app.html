<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legacy</title>
<meta name="theme-color" content="#3d8fe0">
<style>
:root{
--sky1:#3d8fe0;--sky2:#cfe9ff;--m1:#93b6d9;--m2:#5f88b3;--m3:#355b85;
--tx:#0f1b33;--mu:#4a5a78;--line:rgba(15,27,51,.16);--track:rgba(15,27,51,.14);
--panel:rgba(255,255,255,.80);--panel-s:#f6f9ff;--field:rgba(255,255,255,.65);--field2:rgba(15,27,51,.08);
--acc:#b5301d;--acc-t:#fff;--seal:#c8391f;--ink:#1c1814;--ok:#1f8a54;--bad:#c93b3b;
--au:var(--acc);--au2:var(--acc);--em:var(--bad);--bl:#5b9dff;--p1:var(--panel);--p2:var(--field);--p3:var(--field2);--ln:var(--line);--bg:var(--sky2);--r:12px;
--disp:'LgNum','Pixelify Sans','Courier New',monospace;--bw:2px;--sh:4px;--d50:none;--d25:none;--shd:#000}
@font-face{font-family:'Pixelify Sans';src:url(fonts/pixelify.woff2) format('woff2');font-weight:400 700;font-display:swap}
/* Pixelify's 5 reads as an S, so digits come from Micro 5, a pixel font with a clear 5 */
@font-face{font-family:'LgNum';src:url(fonts/num.woff2) format('woff2');unicode-range:U+30-39;size-adjust:130%;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}html[data-mode=dark]{color-scheme:dark}
html,body{margin:0;color:var(--tx);font:15px/1.5 system-ui,-apple-system,Roboto,'Segoe UI',sans-serif}
html{background:var(--sky2)}
body{padding-top:env(safe-area-inset-top);min-height:100vh}
#sky{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;overflow:hidden;background:var(--sky1)}
#dc{position:absolute;top:0;right:0;left:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.seal{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--seal);color:#fff;font-family:'Shippori Mincho','Noto Serif JP',serif;font-weight:600;font-size:17px;line-height:1;border-radius:3px;transform:rotate(-5deg);margin-left:4px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding:0 16px calc(120px + 24vh + env(safe-area-inset-bottom))}
/* headings and loose notes sit on a small background block so they stay readable over the mountain */
h2{width:fit-content;}
.gear{display:flex;align-items:center;gap:8px;background:var(--field);color:var(--tx);border:var(--bw) solid var(--bd);box-shadow:3px 3px 0 var(--shd);padding:8px 12px;font-family:var(--disp);font-size:14px;margin-top:18px}.gear:active{transform:translate(2px,2px);box-shadow:none}
h2{max-width:100%;background:var(--panel);padding:4px 12px 4px 6px}
#app>.xs.mu,#app>.sm.mu,.pane>.xs.mu,.pane>.sm.mu,#app>.mu,.pane>.mu,#app>.hero,.pane>.hero,#app>.quote,.pane>.quote,.lock .word,.lock>.mu,.lock>.hero,.lock .quote,.lock>p{background:var(--panel);width:fit-content;max-width:100%;padding:2px 8px}
.top{background:var(--panel);margin:0 -16px;padding:12px 16px 8px;position:relative;z-index:2}
.lock .word{padding:6px 4px 6px 14px}
h1,h2,h3,.disp{font-family:var(--disp);margin:0;font-weight:400;letter-spacing:.005em}
h2{font-size:30px;margin:30px 0 12px;line-height:1.1;display:flex;align-items:center;gap:12px}
h2::before{content:'';width:9px;height:24px;background:var(--seal);border-radius:1px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
h3{font-size:22px;margin:0 0 8px;color:var(--tx)}
a{color:var(--acc)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px}
.bk{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--field);color:var(--tx);display:flex;align-items:center;justify-content:center;flex:none;padding:0}.bk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.top .l{display:flex;align-items:center;gap:10px;min-width:0}
.hr{display:flex;align-items:center;gap:10px;flex:none}.tb{background:var(--field);border:1.5px solid var(--line);color:var(--tx);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;letter-spacing:.04em}
@media(max-width:480px){.brand b{font-size:23px;letter-spacing:.18em}.brand{gap:7px}.sync span{display:none}.sync.error span,.sync.saving span{display:inline}.top .l{flex:1 1 auto;min-width:0;overflow:hidden}.bk+.brand .seal{display:none}.hr{gap:8px}}
@media(max-width:380px){.brand b{font-size:19px;letter-spacing:.1em}.brand .mark{width:24px}.bk{width:36px;height:36px}.tb{padding:6px 11px}}
.brand{display:flex;align-items:center;gap:10px;color:var(--tx)}
.brand b{font-family:var(--disp);font-size:28px;letter-spacing:.28em;font-weight:400}
.mark{width:32px;height:32px}
.sync{font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.saving i{background:#e0a82e}.sync.error i{background:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:relative}
.card.gold{background:linear-gradient(160deg,var(--panel),var(--acc-14))}
.row{display:flex;gap:10px;align-items:center}
.sp{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}
.big{font-family:var(--disp);font-weight:400;font-size:44px;line-height:1}
.btn{background:var(--acc);color:var(--acc-t);border:1px solid transparent;border-radius:14px;padding:11px 20px;font-weight:600;letter-spacing:.02em;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn:active{transform:scale(.98);opacity:.9}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--line)}
.btn.dark{background:var(--field2);color:var(--tx)}
.btn.red{background:transparent;color:var(--bad);border-color:var(--bad-45)}
.btn.blk{width:100%}
.btn.s{padding:6px 14px;min-height:36px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{background:var(--field);border:1px solid var(--line);color:var(--tx);padding:7px 14px;border-radius:99px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.hs{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 8px;scrollbar-width:none;margin:0 -16px}
.hs::-webkit-scrollbar{display:none}
input[type=text],input[type=number],input[type=date],input[type=password],select{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 13px;width:100%;min-height:46px;outline:0;color:var(--tx)}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-25)}
input::placeholder{color:var(--mu);opacity:.8}
label.f{display:block;margin:14px 0 0;font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.09em}
label.f>*{margin-top:6px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--tx)}
.uf{display:flex;gap:8px;align-items:stretch}.uf input{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--field);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;background:transparent;border:0;border-radius:9px;padding:9px 6px;color:var(--mu);font-weight:600;font-size:13px}
.seg button.on{background:var(--acc);color:var(--acc-t)}
nav.nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.nav div{display:flex;width:100%;max-width:640px}
nav.nav button{flex:1;background:none;border:0;color:var(--mu);padding:12px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;letter-spacing:.04em;position:relative}
nav.nav button.on{color:var(--acc)}
nav.nav button.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:4px;background:var(--seal);border-radius:0 0 2px 2px}
nav.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ex h4{margin:0;font-size:16px;font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--field2);color:var(--mu);margin:4px 4px 0 0}
.tag.m{background:var(--acc-18);color:var(--acc)}
.yt{color:var(--acc)!important;border:1px solid var(--acc-50)!important;background:transparent!important}
.empty{color:var(--mu);text-align:center;padding:22px 8px;font-size:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tiles .big{font-size:38px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);font-weight:600}
.delta.up{color:var(--bad)}.delta.dn{color:var(--ok)}
.bmi-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:14px}
.bmi-bar i{display:block;height:100%}
.bmi-wrap{position:relative}
.bmi-pin{position:absolute;top:-6px;width:4px;height:20px;background:var(--tx);border-radius:3px;box-shadow:0 0 0 2px var(--panel-s);transform:translateX(-2px)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:14px;background:var(--field);border:1px solid var(--line);font-size:24px;font-weight:500;line-height:1}
.stepper button:active{background:var(--field2)}
.stepper .v{flex:1;text-align:center;font-family:var(--disp);font-size:46px;line-height:1}
.stepper .v small{display:block;font-family:Inter,sans-serif;font-size:11px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.12em;margin-top:4px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--field);border-radius:12px;margin:6px 0;font-size:14px}
.setrow b{color:var(--acc);font-family:var(--disp);font-weight:400;font-size:19px;margin-right:8px}
.x{background:none;border:0;color:var(--mu);font-size:19px;padding:4px 8px}
.ring{display:block;margin:6px auto;width:min(78vw,300px);height:auto}
.ring text{font-family:var(--disp);fill:var(--tx)}
.ring .bg{stroke:var(--track)}
[data-tone=work] .rg{stroke:var(--acc)}[data-tone=rest] .rg{stroke:var(--tx)}[data-tone=prep] .rg{stroke:var(--mu)}[data-tone=ok] .rg{stroke:var(--ok)}[data-tone=au] .rg{stroke:var(--acc)}
.tbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:19;display:flex;justify-content:center;padding:0 12px 10px;pointer-events:none}
.tbar>div{pointer-events:auto;max-width:616px;width:100%;background:var(--panel-s);border:1px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.28)}
.tbar .t{font-family:var(--disp);font-size:32px;line-height:1;min-width:84px}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(5,8,22,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--panel-s);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:24px 18px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:640px}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 8px;gap:12px;color:var(--tx)}
.lock .word{font-family:var(--disp);font-size:56px;letter-spacing:.3em;margin-right:-.3em;line-height:1}
.hero{font-family:var(--disp);font-size:30px;line-height:1.1}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--panel-s);padding:9px 18px;border-radius:99px;font-weight:500;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.tpl{min-width:200px;max-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;flex:none;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tpl.off{opacity:.5}
.rbar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin:12px 0 4px}.rbar i{display:block;height:100%;background:var(--seal);border-radius:99px}
.ph{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;background:var(--seal);color:#fff;letter-spacing:.04em}
.rnote{font-size:12.5px;margin:8px 0 0;padding:7px 10px;border-radius:9px;background:var(--ok-16);color:var(--tx)}
.rnote.warn{background:var(--bad-14)}
.tag.warn{background:var(--bad-16);color:var(--bad)}
.ckA{display:flex;flex-wrap:wrap;gap:8px}.ckI{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.cal b{font-size:11px;text-align:center;color:var(--mu);font-weight:600;padding:4px 0}
.cd{aspect-ratio:1/1.05;background:var(--field);border:1.5px solid transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx);font-size:14px;font-weight:600;padding:0;position:relative}
.cd em{display:flex;gap:3px;min-height:7px;font-style:normal}.cd u{width:6px;height:6px;border-radius:50%;display:block;box-sizing:border-box}
.d1{background:var(--seal)}.d2{border:1.5px solid var(--seal)}.d3{background:var(--bad)}.d4{background:var(--ok)}
.cd.today{border-color:var(--tx)}.cd.sel{background:var(--acc);color:var(--acc-t)}.cd.sel .d1{background:#fff}.cd.sel .d2{border-color:#fff}.cd.sel .d3,.cd.sel .d4{background:#ffd6cf}
.cd.sick{background:repeating-linear-gradient(135deg,var(--field2) 0 4px,var(--field) 4px 8px)}.cd.sel.sick{background:var(--acc)}
.cd.rc::after{content:'';position:absolute;left:7px;right:7px;bottom:3px;height:3px;border-radius:2px;background:var(--ok);opacity:.8}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--mu);margin-top:14px}.leg span{display:inline-flex;align-items:center;gap:5px}
.cd.in{background:var(--acc-22)}.cd:disabled{opacity:.3}
.spl{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--field)}.spl.on{border-color:var(--seal)}
.lvl{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;background:var(--field);text-align:left;width:100%;color:var(--tx);display:block}.lvl.on{border-color:var(--seal);background:var(--seal-10)}
.rnote.coach{background:var(--acc-12)}
.les{border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--field);overflow:hidden}.les>button{width:100%;background:none;border:0;color:var(--tx);text-align:left;padding:13px 14px;display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px}.les .bd{padding:0 14px 14px;font-size:14px;line-height:1.55}.les .bd p{margin:8px 0}.les .bd ul{margin:6px 0;padding-left:18px}.les .bd li{margin:4px 0}
.gd{position:fixed;top:0;right:0;bottom:0;left:0;z-index:45;overflow-y:auto;background:linear-gradient(180deg,var(--sky1),var(--sky2));padding:14px 16px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.gd>div{width:100%;max-width:560px}.gdt{display:flex;align-items:center;gap:12px}
.gring{fill:none;stroke-width:12}.gring.bg{stroke:var(--track)}.gring.fg{stroke:var(--seal);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.gd[data-ph=rest] .gring.fg{stroke:var(--ok)}.gd[data-ph=ready] .gring.fg{stroke:var(--acc)}
.gph{text-align:center;font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--mu);margin-top:14px}
.gbig{font-family:var(--disp);font-size:36px;line-height:1.05;text-align:center;margin:6px 0}
.gctl{display:flex;gap:16px;align-items:center;justify-content:center;margin-top:14px}.gctl button{border-radius:50%;display:flex;align-items:center;justify-content:center}
.gctl .rd{width:56px;height:56px;border:1.5px solid var(--line);background:var(--field);color:var(--tx)}.gctl .pp{width:78px;height:78px;background:var(--seal);color:#fff;border:0}
.gd .ring{width:230px;height:230px;display:block;margin:6px auto 0}
.modal>div.sheet-in{max-height:90vh;overflow-y:auto;overscroll-behavior:contain}
#tour{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70}
#tr-spot{position:fixed;border-radius:14px;box-shadow:0 0 0 3px #ff6a4d,0 0 0 9999px rgba(8,10,28,.66);pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s}
#tr-tip{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:420px;background:var(--panel-s);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#tr-tip h3{margin:4px 0 6px;font-family:var(--disp);font-size:24px;font-weight:400}#tr-tip p{margin:0 0 12px;font-size:14.5px;line-height:1.5}
.sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}.rrow .n{font-size:26px;font-family:var(--disp);min-width:60px;text-align:center}
.divider{height:1px;background:var(--line);margin:16px 0}
svg text{font-family:Inter,sans-serif}
.quote{margin:18px 4px 22px;padding:0 0 0 18px;border-left:3px solid var(--seal);font-family:var(--disp);font-size:22px;line-height:1.3;font-style:italic;color:var(--tx)}
.lock .quote{border-left:0;padding:0;margin:8px 10px 24px;max-width:340px}

.hint{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--seal-8);border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:10px}
.pth{aspect-ratio:3/4;border-radius:12px;background-size:cover;background-position:center;border:1px solid var(--line);position:relative;padding:0;display:block;width:100%}
.pth span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:2px 6px;border-radius:99px}
#conf{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:90;overflow:hidden}
#conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:cf 1.5s ease-in forwards}
@keyframes cf{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
body.wide #app{max-width:1240px}
body.wide nav.nav div{max-width:760px}
body.wide .tbar>div{max-width:1200px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.pane{height:calc(100vh - 160px - env(safe-area-inset-bottom));min-height:300px;overflow-y:auto;padding:0 8px 40px 2px;overscroll-behavior:contain}
.pane+.pane{border-left:1px solid var(--line);padding-left:20px}
.pbar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}

/* ===== v2 dithered skin ===== */
.card,.ex,.tile,.tpl,.tbar>div,.modal>div,#tr-tip,.les,.spl,.lvl,.setrow,.ckI,.hint,.bk,.tb,.chip,.seg,.cd,input[type=text],input[type=number],input[type=date],input[type=password],select,.stepper button,.btn,.pth,.gctl .rd{border-radius:0!important}
.card,.ex,.tile,.tpl{background:var(--panel);border:var(--bw) solid var(--bd,var(--tx));box-shadow:var(--sh) var(--sh) 0 var(--shd);backdrop-filter:none;-webkit-backdrop-filter:none;position:relative}

async function deriveFb(u,pw){const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode('legacy-fb:'+u),iterations:200000,hash:'SHA-256'},km,256);return b64(new Uint8Array(bits))}
async function submitAuth(mode){
  const u=normU($('#a_u').value),pw=$('#a_p').value,up=mode==='up',btn=$('#a_go');
  const fail=m=>authScreen(mode,m,u);
  if(!U_OK.test(u))return fail('Username must be 3–20 letters, numbers, dots, dashes or underscores.');
  if(pw.length<6)return fail('Password must be at least 6 characters.');
  if(up&&pw!==$('#a_p2').value)return fail('Passwords do not match.');
  const rm=$('#a_rm').checked;btn.disabled=true;btn.textContent='One moment…';
  try{
    const ref=DB.doc('accts/'+u),A=DB.auth;
    let key,snap=null,fp=null;
    if(A){
      fp=await deriveFb(u,pw);
      if(up){
        try{await A.signUp(u,fp)}
        catch(e){
          if(e&&e.code==='auth/email-already-in-use'){
            /* an earlier sign-up may have stopped halfway: finish it only if it is truly empty */
            let ok=false;try{await A.signIn(u,fp);ok=!(await ref.get()).exists}catch(e2){}
            if(!ok)return fail('That username is taken. Try another.');
          }else throw e;
        }

        try{await A.signIn(u,fp)}
        catch(e){if(e&&/invalid-credential|user-not-found|wrong-password|invalid-email/.test(e.code||''))return fail('Wrong username or password.');throw e}
        snap=await ref.get();

      }
    }else snap=await ref.get();
    if(up){
      if(snap&&snap.exists)return fail('That username is taken. Try another.');
      const salt=crypto.getRandomValues(new Uint8Array(16));
      key=await deriveKey(pw,salt,IT);
      await ref.set({salt:b64(salt),it:IT,chk:await seal(key,{ok:'legacy'})});
    }else{
      if(!snap.exists)return fail('No account with that username.');
      const a=snap.data();key=await deriveKey(pw,unb64(a.salt),a.it||IT);
      try{await open(key,a.chk)}catch(e){return fail('Wrong password.')}
      if(a.dk){try{key=await crypto.subtle.importKey('jwk',(await open(key,a.dk)).k,{name:'AES-GCM'},true,['encrypt','decrypt'])}catch(e){return fail('Wrong password.')}}
    }
    if(rm){try{localStorage.setItem('legacy_session',JSON.stringify({u,k:await crypto.subtle.exportKey('jwk',key)}))}catch(e){}}
    if(up&&fp&&typeof rkCreate==='function'){let rc=null;try{rc=await rkCreate(u,key,fp)}catch(e){console.error('recovery code',e)}if(rc){rkShowScreen(rc,u,()=>enter(u,key));return}}
    enter(u,key);
  }catch(e){console.error(e);fail('Something went wrong. Check your connection and try again.'+(e&&(e.code||e.message)?' ['+String(e.code||e.message).slice(0,90)+']':''))}
}

let LD=null,DONE=0;
function ldSet(k,v){if(!LD)return;LD[k]=v;ldPaint()}

function enter(u,key){
  resetState();S.user=u;KEY=key;loadActive();
  const L0={t0:Date.now(),stage:'Connecting to the database…',live:'waiting…',cache:'not checked yet',direct:'not needed yet',err:''};LD=L0;
  render();
  const mine=()=>LD===L0&&S.user===u;
  const errTxt=e=>String(e&&(e.code||e.message)||e).slice(0,160);
  const apply=async(snap,src)=>{
    if(!mine())return;
    const my=++SEQ,out={};
    if(!S.loaded)ldSet('stage','Unlocking '+snap.docs.length+' records…');
    await Promise.all(snap.docs.map(async d=>{try{out[d.id.slice(u.length+1)]=await open(KEY,d.data())}catch(e){}}));
    if(!mine())return;
    // a newer answer already finished: skip this older one (but never skip while nothing has loaded)
    if(my<DONE)return;DONE=my;
      const logs={};let prof=out.profile||null,wts=out.weights?out.weights.entries||[]:null;
      Object.keys(out).forEach(id=>{if(id.startsWith('log_'))logs[id.slice(4)]=out[id].sessions||[]});
      if(!(W.profile&&W.profile.busy))S.profile=normP(prof);
      if(!(W.weights&&W.weights.busy))S.weights=wts||[];
      if(!(W.meas&&W.meas.busy))S.meas=out.meas?out.meas.entries||[]:[];
      if(!(W.acts&&W.acts.busy))S.acts=out.acts?out.acts.items||[]:[];
      if(!(W.food&&W.food.busy))S.food=Object.assign({days:{},custom:[],fav:[]},out.food||{});
      if(!(W.ready&&W.ready.busy))S.rdy=out.ready?out.ready.days||{}:{};
      if(!Object.keys(W).some(k=>k.startsWith('ph_')&&W[k].busy))S.photos=Object.keys(out).filter(id=>id.startsWith('ph_')).map(id=>out[id]);
      const nl={};
      new Set([...Object.keys(logs),...Object.keys(S.logs)]).forEach(m=>{const w=W['log_'+m];if(w&&w.busy){nl[m]=S.logs[m]}else if(logs[m])nl[m]=logs[m]});
      S.logs=nl;
      const first=!S.loaded;S.loaded=true;S.slow=false;if(first&&src!=='cache')S.fromDevice=false;if(src==='cache')S.fromDevice=true;
      if(first){S.todayEq=S.profile&&S.profile.equip?S.profile.equip.slice():['bw'];if(lsGet('legacy_gym_day')===today())S.todayEq=Object.keys(EQ)}
      if(S.profile&&S.profile.look){LOOK=normLook(S.profile.look);try{localStorage.setItem('legacy_look',JSON.stringify(LOOK))}catch(e){}applySky(true)}
      LD.src=src;

      if(first&&!S.profile)checkLegacy();
      if(first&&S.profile){try{applyReminders();checkUpdate();pubBoard();announce()}catch(e){console.error(e)}}else if(first)lsSet('legacy_seen_ver',VER);
  };

      if(snap.fromCache&&!snap.docs.length&&!S.loaded){ldPaint();return} // an empty device copy is not an answer

    },err=>{

    const c=col.where('u','==',u);if(!c.getDirect){L0.direct='not available';ldPaint();return}
    directTries++;L0.direct='trying…';ldSet('stage','Trying a direct connection…');

      if(!mine())return;if(!s)throw{code:'no answer in 20s'};L0.direct='answered ('+s.docs.length+')';ldPaint();

    });
  }
  setTimeout(()=>{if(mine()&&(!S.loaded||LD.src==='cache')&&!/^answered \(/.test(L0.live))tryDirect()},5000);
}

/* ================= TIMER ENGINE ================= */
function ensureAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f=880,d=.14,v=.28){if(S.profile&&S.profile.sound===false)return;try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d+.03)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function mkPhases(c){const a=[];if(c.prep)a.push({n:'Get ready',d:c.prep,k:'prep'});for(let r=1;r<=c.rounds;r++){a.push({n:c.emom?'Minute '+r:'Work',d:c.work,k:'work',r});if(r<c.rounds&&c.wrest)a.push({n:'Rest',d:c.wrest,k:'rest',r})}return a}
function startT(kind,o){
  ensureAudio();
  T=Object.assign({kind,run:true,t0:Date.now(),acc:0,done:false,laps:[],ls:-1,lp:-1},o);
  if(kind==='interval'){T.phases=mkPhases(T.cfg);T.total=T.phases.reduce((a,p)=>a+p.d*1000,0)}
  render();
}
const tEl=()=>T?T.acc+(T.run?Date.now()-T.t0:0):0;
function tInfo(){
  const el=tEl();
  if(T.kind==='sw')return{ms:el,frac:(el%60000)/60000,phase:T.label||'Stopwatch',sub:T.laps.length?'Lap '+(T.laps.length+1):(T.sub||''),tone:'au',up:true};
  if(T.kind==='interval'){
    let acc=0,i=0;const ph=T.phases;
    for(;i<ph.length;i++){if(el<acc+ph[i].d*1000)break;acc+=ph[i].d*1000}
    if(i>=ph.length)return{ms:0,frac:1,phase:'Done',sub:'Great work',tone:'ok',idx:i,done:true};
    const p=ph[i],left=acc+p.d*1000-el;
    return{ms:left,frac:1-left/(p.d*1000),phase:p.n,sub:p.r?'Round '+p.r+' of '+T.cfg.rounds+' · '+mmss(T.total-el)+' left':'',tone:p.k,idx:i,done:false};
  }
  const left=T.total-el;
  return{ms:Math.max(0,left),frac:Math.min(1,el/T.total),phase:left<=0?(T.kind==='work'?'Time!':'Rest over'):(T.label||'Rest'),sub:T.amrap?'Rounds: '+(T.rounds||0):left<=0?(T.kind==='work'?'Log your set':'Next set'):(T.sub||''),tone:left<=0?'ok':(T.kind==='work'?'work':'rest'),idx:0,done:left<=0};
}
function tick(){
  if(T&&T.run&&!T.done){
    const i=tInfo();
    if(T.kind!=='sw'){
      if(i.done){
        T.done=true;T.run=false;T.acc=T.kind==='interval'?T.total:T.total;
        beep(988,.5,.35);setTimeout(()=>beep(1175,.5,.35),260);buzz([300,120,300]);
        render();return;
      }
      if(T.kind==='interval'&&i.idx!==T.lp){T.lp=i.idx;T.ls=-1;if(i.tone==='work'){beep(1046,.5,.35);buzz(250)}else if(i.tone==='rest'){beep(587,.35,.3);buzz([90,60,90])}}
      const sl=Math.ceil(i.ms/1000);
      if(sl<=3&&sl>0&&sl!==T.ls){T.ls=sl;beep(740,.09)}
    }
  }
  paintTimer();
}
function paintTimer(){
  if(T){
    const i=tInfo(),C=565.49;
    $$('[data-tv=time]').forEach(e=>e.textContent=i.up?mmss(i.ms)+'.'+Math.floor(i.ms%1000/100):mmss(i.ms));
    $$('[data-tv=phase]').forEach(e=>e.textContent=i.phase);
    $$('[data-tv=sub]').forEach(e=>e.textContent=i.sub);
    $$('canvas[data-dt=tv]').forEach(e=>{e.dataset.p=i.frac;e.dataset.ms=i.ms;e.dataset.tone=i.tone;dtDraw(e)});
    $$('[data-tone]').forEach(e=>e.setAttribute('data-tone',i.tone));
  }
  if(S.sess)$$('[data-tv=wo]').forEach(e=>e.textContent=hms(Date.now()-S.sess.s));
}
setInterval(tick,250);

function bmiCat(b){return b<18.5?['Underweight','var(--bl)']:b<25?['Healthy','var(--ok)']:b<30?['Overweight','#e0a82e']:['Obese','var(--em)']}

/* ---------- guided workout ---------- */
const GD_C=565.49;
const gdName=x=>BYID[x]?BYID[x].name:x;
function gdSets(x){const m=S.sess&&S.sess.mk,R=recInfo();return m?m.sets:R&&R.ph<4?R.sets:tSets()}
function gdRestDef(){const RI=recInfo();return Math.round(((S.sess&&S.sess.mk?S.sess.mk.rest:+S.profile.rest)||60)*(RI&&RI.ph<4?RI.rest:1))}
function gdSteps(){
  const s=S.sess,st=[];
  s.exs.forEach(x=>{const tot=gdSets(x),done=s.sets.filter(t=>t.x===x).length,left=Math.max(0,tot-done);for(let k=0;k<left;k++)st.push({x,n:done+k+1,of:Math.max(tot,done+left)})});
  if(!st.length)s.exs.forEach(x=>{const tot=gdSets(x);for(let k=0;k<tot;k++)st.push({x,n:k+1,of:tot})});
  return st;
}
function gdSay(t){const g=S.gd;if(!g||!g.opt.voice||(S.profile&&S.profile.sound===false))return;try{if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.05;speechSynthesis.speak(u)}}catch(e){}}
function gdWorkMs(st){const e=BYID[st.x],g=S.gd;if(e.k==='t')return draftFor(st.x).d*1000;return g.opt.style==='timed'?g.opt.workSec*1000:0}
function gdEst(){const g=S.gd;let t=g.opt.ready;g.steps.forEach((st,i)=>{const w=gdWorkMs(st)/1000||40;t+=w+(i<g.steps.length-1?g.opt.rest:0)});return Math.round(t/60)}
function gdGo(ph){
  const g=S.gd,now=Date.now(),st=g.steps[g.i];g.ph=ph;g.run=true;g.lb=-1;g.half=false;g.pw=0;
  if(ph==='ready'){g.dur=g.opt.ready*1000;g.end=now+g.dur;gdSay('Get ready. '+gdName(st.x))}
  else if(ph==='work'){g.dur=gdWorkMs(st);g.end=g.dur?now+g.dur:0;g.ws=now;beep(1040,.25);buzz(60);gdSay('Go')}
  else if(ph==='rest'){g.dur=g.opt.rest*1000;g.end=now+g.dur;const nx=g.steps[g.i+1];gdSay('Rest.'+(nx?' Next: '+gdName(nx.x):''))}
  render();
}
function gdLog(st){
  const d=draftFor(st.x),ex=BYID[st.x],t={x:st.x,t:Date.now()};
  if(ex.k==='t'){t.d=d.d;t.r=0}else t.r=d.r;
  if(d.w){t.w=d.w;t.u=unit()}
  if(d.rpe&&ex.k!=='t')t.rpe=d.rpe;
  prCheck(t);S.sess.sets.push(t);st.ref=t;saveActive();
}
function gdUnlog(st){if(st&&st.ref){const i=S.sess.sets.indexOf(st.ref);if(i>=0)S.sess.sets.splice(i,1);st.ref=null;saveActive()}}
function gdAfterWork(log){
  const g=S.gd,st=g.steps[g.i];if(log)gdLog(st);
  if(g.i>=g.steps.length-1){gdFinishPhase();return}
  gdGo('rest');
}
function gdFinishPhase(){const g=S.gd;g.ph='done';g.run=false;g.doneAt=Date.now();beep(1040,.4);buzz([80,60,80]);gdSay('Workout complete. Great job.');render()}
function gdNext(auto){
  const g=S.gd;if(!g)return;
  if(g.ph==='ready')gdGo('work');
  else if(g.ph==='work')gdAfterWork(true);
  else if(g.ph==='rest'){g.i++;gdGo('work')}
}
function gdTick(){
  const g=S.gd;if(!g||!g.run)return;
  if(g.ph==='ready'||g.ph==='rest'||(g.ph==='work'&&g.end)){
    const left=g.end-Date.now(),sec=Math.ceil(left/1000);
    if(sec<=3&&sec>=1&&g.lb!==sec){g.lb=sec;beep(660,.1);buzz(20)}
    if(g.ph==='work'&&!g.half&&g.dur>=20000&&left<=g.dur/2){g.half=true;gdSay('Halfway')}
    if(left<=0){gdNext(true);return}
  }
  gdPaint();
}
function gdPaint(){
  const g=S.gd;if(!g)return;
  const now=g.run?Date.now():(g.pw||Date.now());
  const tm=document.querySelector('[data-gv=time]');
  if(tm){let txt,fr=0;
    if(g.end){const left=Math.max(0,g.end-now);txt=mmss(left);fr=1-left/(g.dur||1)}
    else{const el=Math.max(0,now-g.ws);txt=mmss(el)+'';fr=(el%60000)/60000;tm.textContent=p2(Math.floor(el/60000))+':'+p2(Math.floor(el/1000)%60)}
    if(g.end)tm.textContent=txt;
    const rg=document.querySelector('canvas[data-dt=gv]');if(rg){rg.dataset.p=fr;rg.dataset.ms=g.end?Math.max(0,g.end-now):0;rg.dataset.tone=g.ph==='work'?'work':g.ph==='ready'?'prep':'rest';dtDraw(rg)}
  }
  const wo=document.querySelector('[data-gv=wo]');if(wo)wo.textContent=hms(now-g.t0-g.paused);
}
setInterval(gdTick,250);

    <button class="btn blk" data-act="gdStart">Start</button></div></div>`;
  }

  }
  const st=g.steps[g.i],e=BYID[st.x],d=draftFor(st.x),m=wmode(e),timed=e.k==='t',nx=g.steps[g.i+1];

/* ---------- progress ---------- */
function lineChart(pts,goal,u){
  if(pts.length<2)return`<div class="empty">Log at least two weigh-ins to see your trend.</div>`;
  const Wd=600,H=220,pl=44,pr=14,pt=14,pb=28;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  if(goal!=null){lo=Math.min(lo,goal);hi=Math.max(hi,goal)}
  const pad=Math.max((hi-lo)*.2,.6);lo-=pad;hi+=pad;
  const x0=pts[0].t,x1=pts[pts.length-1].t||x0+1;
  const X=t=>pl+(t-x0)/((x1-x0)||1)*(Wd-pl-pr),Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  const line=pts.map(p=>X(p.t).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ');
  const area=`${X(x0)},${H-pb} ${line} ${X(x1)},${H-pb}`;
  const ticks=[0,1,2,3].map(i=>lo+(hi-lo)*i/3);
  return`<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="Weight over time">
  ${ticks.map(v=>`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mu)">${rnd(v,1)}</text>`).join('')}
  ${goal!=null?`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--ok)" stroke-dasharray="6 5"/><text x="${Wd-pr}" y="${Y(goal)-5}" text-anchor="end" font-size="11" fill="var(--ok)">Goal ${rnd(goal,1)}</text>`:''}
  <polygon points="${area}" fill="var(--acc)" opacity=".16"/><polyline points="${line}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.length<=60?pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3.5" fill="var(--panel-s)" stroke="var(--acc)" stroke-width="2"/>`).join(''):''}
  <text x="${pl}" y="${H-8}" font-size="11" fill="var(--mu)">${dlabel(dkey(x0))}</text><text x="${Wd-pr}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--mu)">${dlabel(dkey(x1))}</text></svg>`;
}
function weekBars(){
  const ws=weekStart(Date.now()),n=8,counts=[];
  for(let i=n-1;i>=0;i--){const a=ws-i*7*864e5,b=a+7*864e5;counts.push({a,c:allSessions().filter(s=>s.s>=a&&s.s<b).length})}
  const mx=Math.max(3,...counts.map(c=>c.c)),bw=50,Wd=n*bw+10,H=130;
  return`<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="Workouts per week">${counts.map((c,i)=>{const h=c.c/mx*80;return`<rect x="${i*bw+10}" y="${100-h}" width="34" height="${Math.max(h,2)}" rx="6" fill="${i===n-1?'var(--acc)':'var(--mu)'}"/><text x="${i*bw+27}" y="${94-h}" text-anchor="middle" font-size="12" fill="var(--tx)">${c.c||''}</text><text x="${i*bw+27}" y="118" text-anchor="middle" font-size="10" fill="var(--mu)">${dlabel(dkey(c.a))}</text>`}).join('')}</svg>`;
}

  let w=top.u===u?top.w:rnd(fromKg(toKg(top.w,top.u),u),1);

/* ---------- streaks and rest days ---------- */
function streakInfo(){
  const P=S.profile||{},ss=allSessions(),W=new Set(ss.map(s=>dkey(s.s)));
  const R=new Set([...(P.sick||[]),...(P.plan||[]).filter(p=>p.n==='Rest day').map(p=>p.d)]);
  const day0=()=>{const d=new Date();d.setHours(12,0,0,0);return d};
  let c=0,un=0;const d=day0();
  if(!W.has(dkey(d.getTime())))d.setDate(d.getDate()-1);
  for(let i=0;i<900;i++){const k=dkey(d.getTime());if(W.has(k)){c++;un=0}else if(R.has(k)){un=0}else{un++;if(un>=2)break}d.setDate(d.getDate()-1)}
  let best=0;
  if(ss.length){const first=new Date(ss[ss.length-1].s);first.setHours(12,0,0,0);const e=day0();let run=0,u2=0;
    for(const x=new Date(first);x<=e;x.setDate(x.getDate()+1)){const k=dkey(x.getTime());if(W.has(k)){run++;u2=0;if(run>best)best=run}else if(R.has(k)){u2=0}else{u2++;if(u2>=2){run=0}}}}
  const goal=+P.wk||3,wc={};ss.forEach(s=>{const w=weekStart(s.s);wc[w]=(wc[w]||0)+1});
  let wk=0,w0=weekStart(Date.now());if((wc[w0]||0)<goal)w0-=7*864e5;
  while((wc[w0]||0)>=goal){wk++;w0-=7*864e5}
  const t=today();
  return{days:c,best:Math.max(best,c),weeks:wk,doneToday:W.has(t),restToday:R.has(t)&&!W.has(t),goal};
}
function streakCard(){
  const s=streakInfo();

  const sub=`Best ${s.best} day${s.best===1?'':'s'}${s.weeks?` · ${s.weeks} week${s.weeks===1?'':'s'} on goal`:''}`;
  const btn=s.doneToday?'<span class="tag m">Trained today</span>':`<button class="btn s ${s.restToday?'':'dark'}" data-act="restToday">${s.restToday?'Resting today ✓':'Rest day today'}</button>`;
  return`<div class="card"><div class="row sp"><div><div class="lbl">Streak</div><div style="font-weight:700;font-size:19px">${line}</div><div class="xs mu">${sub}</div></div>${btn}</div><div class="xs mu" style="margin-top:8px">Rest days and sick days never break your streak. One unplanned day off is fine too. Two in a row ends it.</div></div>`;
}

function shrinkImage(file,max,cb){

function nutTarget(){
  const P=S.profile,kg=bodyKg(),cm=P.heightCm,age=+P.age,sex=P.sex;
  if(!cm||!age||!sex||!latestW())return null;
  const bmr=10*kg+6.25*cm-5*age+(sex==='f'||sex==='female'?-161:5),tdee=bmr*(+P.act||1.375);
  const g=P.nutGoal||(P.goalKg&&P.goalKg<kg-1?'lose':P.goalKg&&P.goalKg>kg+1?'gain':'keep');
  let kcal=g==='lose'?tdee*.8:g==='gain'?tdee*1.1:tdee;kcal=Math.round(kcal/10)*10;
  const p=Math.round(kg*(g==='lose'?2:1.8)),f=Math.round(kcal*.25/9),c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),goal:g,kcal:P.nutKcal>0?P.nutKcal:kcal,p:P.nutP>0?P.nutP:p,f,c,auto:!(P.nutKcal>0)};
}

  const kc=days.map(d=>{const t=tot(dayFood(d));return t.k||null}),wt=days.map(d=>{const w=S.weights.find(x=>x.d===d);return w?w.kg/WF[wu()]:null});

  const Wd=600,H=200,pl=40,pr=40,pt=12,pb=22,X=i=>pl+i/(n-1)*(Wd-pl-pr);
  const kv=kc.filter(Boolean),wv2=wt.filter(Boolean),km=Math.max(500,...kv)*1.1;
  const wlo=Math.min(...(wv2.length?wv2:[0]))-.5,whi=Math.max(...(wv2.length?wv2:[1]))+.5,Yk=v=>pt+(1-v/km)*(H-pt-pb),Yw=v=>pt+(1-(v-wlo)/((whi-wlo)||1))*(H-pt-pb);

  return`<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="Weight and calories over 30 days"><line x1="${pl}" x2="${Wd-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--tx)" stroke-width="2"/>${bars}${path?`<path d="${path}" fill="none" stroke="var(--tx)" stroke-width="3" stroke-linejoin="miter"/>`:''}${wt.map((v,i)=>v!=null?`<rect x="${X(i)-3}" y="${Yw(v)-3}" width="6" height="6" fill="var(--panel-s)" stroke="var(--tx)" stroke-width="2"/>`:'').join('')}

/* ================= CALCULATORS (v2.2) =================
   Body fat, lean mass, BMI and healthy range, ideal weight, BMR/TDEE, macros, protein, water,
   one-rep max, heart-rate zones, calories burned, waist-to-height. Prefilled from the profile and
   latest logs; results update live as you type. */
const CALC=[
 ['bf','Body fat %','US Navy tape method, or an estimate from BMI'],
 ['bmi','BMI and healthy weight','Where you sit and the weight range for your height'],
 ['ideal','Ideal body weight','Four classic formulas for your height'],
 ['tdee','Calories per day','BMR and maintenance calories, plus lose/gain targets'],
 ['macro','Macros','Protein, fat and carbs for your goal'],
 ['prot','Protein','How much protein to eat each day'],
 ['water','Water','Daily water with training'],
 ['orm','One-rep max','Estimate your max from any set, with a % chart'],
 ['hr','Heart-rate zones','Zones 1 to 5 for cardio'],
 ['burn','Calories burned','For any activity and duration'],
 ['whtr','Waist-to-height','A simple health-risk check']
];
S.calcOpen=S.calcOpen||'bf';
const cU=()=>waistU(); // cm or in for tape lengths
const cHeightCm=()=>(S.profile&&S.profile.heightCm)||null;
function cLastMeas(k){const a=(S.meas||[]).filter(e=>e[k]!=null);return a.length?a[a.length-1][k]:null}
function cLastBf(){const a=(S.weights||[]).filter(w=>w.bf);return a.length?a[a.length-1].bf:null}
const cNum=id=>{const e=document.getElementById(id);if(!e)return NaN;const v=parseFloat(String(e.value).replace(',','.'));return isNaN(v)?NaN:v};
const cLenCm=id=>{const v=cNum(id);return v>0?v*HF[cU()]:NaN};
const cKg=id=>{const v=cNum(id);return v>0?v*WF[wu()]:NaN};
const cSex=()=>{const e=document.getElementById('c_sex');return e?e.value:(S.profile&&S.profile.sex)||''};
const cAge=()=>{const v=cNum('c_age');return v>0?v:+(S.profile&&S.profile.age)||NaN};
const cW=(kg)=>`${wv(kg,wu())} ${wu()}`;
const cRes=(big,sub,extra)=>`<div class="cres"><div class="big">${big}</div>${sub?`<div class="sm mu" style="margin-top:4px">${sub}</div>`:''}${extra||''}</div>`;
const cNeed=t=>`<div class="mu sm" style="margin-top:10px">${t}</div>`;

/* shared inputs: only the ones a calculator needs */
function cIn(id,label,val,unit,ph){return`<label class="f" style="margin:0">${label}${unit?` (${unit})`:''}<input type="number" inputmode="decimal" id="${id}" data-in="calc" value="${val!=null&&!isNaN(val)?val:''}" placeholder="${ph||''}"></label>`}
function cSexSel(){const s=(S.profile&&S.profile.sex)||'';return`<label class="f" style="margin:0">Sex<select id="c_sex" data-ch="calcSel"><option value="m"${s==='m'?' selected':''}>Male</option><option value="f"${s==='f'?' selected':''}>Female</option></select></label>`}
function cBase(o){
  const lw=latestW(),h=cHeightCm(),P=S.profile||{},u=cU();
  const parts=[];
  if(o.sex)parts.push(cSexSel());
  if(o.age)parts.push(cIn('c_age','Age',P.age||'',''));
  if(o.h)parts.push(cIn('c_h','Height',h?hv(h,u):'',u));
  if(o.w)parts.push(cIn('c_w','Weight',lw?wv(lw.kg,wu()):'',wu()));

}
function calcForm(k){
  const u=cU(),P=S.profile||{};
  if(k==='bf')return cBase({sex:1,age:1,h:1,w:1})+`<div class="grid2" style="margin-top:10px">${cIn('c_neck','Neck',cLastMeas('neck')!=null?hv(cLastMeas('neck'),u):'',u)}${cIn('c_waist','Waist',cLastMeas('waist')!=null?hv(cLastMeas('waist'),u):'',u)}${cIn('c_hip','Hips',cLastMeas('hips')!=null?hv(cLastMeas('hips'),u):'',u,'women')}</div><p class="mu xs" style="margin:8px 0 0">Neck just below the Adam's apple, waist at the belly button, hips at the widest point. Measure relaxed with the tape flat, not pulled tight. Leave the tape fields empty for a BMI-based estimate.</p>`;
  if(k==='bmi'||k==='ideal'||k==='whtr')return cBase({sex:k==='ideal',h:1,w:k==='bmi'})+(k==='whtr'?`<div class="grid2" style="margin-top:10px">${cIn('c_waist','Waist',cLastMeas('waist')!=null?hv(cLastMeas('waist'),u):'',u)}</div>`:'');
  if(k==='tdee'||k==='macro')return cBase({sex:1,age:1,h:1,w:1})+`<div class="grid2" style="margin-top:10px"><label class="f" style="margin:0">Activity<select id="c_act" data-ch="calcSel">${[[1.2,'Mostly sitting'],[1.375,'Light (1–3 days/week)'],[1.55,'Moderate (3–5 days/week)'],[1.725,'Very active (6–7 days/week)'],[1.9,'Athlete / physical job']].map(([v,l])=>`<option value="${v}"${(+P.act||1.375)===v?' selected':''}>${l}</option>`).join('')}</select></label>${cIn('c_bf','Body fat % (optional)',cLastBf()||'','')}</div>`+(k==='macro'?`<div class="seg" style="margin-top:12px" id="c_goal">${[['lose','Lose fat'],['keep','Maintain'],['gain','Build muscle']].map(([v,l])=>`<button class="${(S.calcGoal||'keep')===v?'on':''}" data-act="calcGoal" data-a="${v}">${l}</button>`).join('')}</div>`:'');
  if(k==='prot'||k==='water')return cBase({w:1})+`<div class="grid2" style="margin-top:10px">${k==='prot'?`<label class="f" style="margin:0">Goal<select id="c_pg" data-ch="calcSel"><option value="keep">Stay healthy</option><option value="lose">Lose fat, keep muscle</option><option value="gain" selected>Build muscle</option></select></label>`:cIn('c_min','Training today','45','min')}</div>`;
  if(k==='orm')return`<div class="grid2" style="margin-top:10px">${cIn('c_lw','Weight lifted','',wu())}${cIn('c_reps','Reps done','5','')}</div>`;
  if(k==='hr')return cBase({age:1})+`<div class="grid2" style="margin-top:10px">${cIn('c_rhr','Resting heart rate (optional)',hcRestHr()||'','bpm')}</div>`;
  if(k==='burn')return cBase({w:1})+`<div class="grid2" style="margin-top:10px"><label class="f" style="margin:0">Activity<select id="c_actv" data-ch="calcSel">${ACTS.map(a=>`<option>${a[0]}</option>`).join('')}</select></label>${cIn('c_dur','Duration','30','min')}</div><div class="seg" style="margin-top:12px">${[['easy','Easy'],['mod','Moderate'],['hard','Hard']].map(([v,l])=>`<button class="${(S.calcInt||'mod')===v?'on':''}" data-act="calcInt" data-a="${v}">${l}</button>`).join('')}</div>`;

}
function hcRestHr(){try{const d=S.hc&&S.hc.days;if(!d)return null;const hr=Object.values(d).map(x=>x.hr).filter(Boolean);return hr.length?Math.round(Math.min(...hr)):null}catch(e){return null}}

/* ---- the maths ---- */
const BFCAT={m:[[6,'Essential fat'],[14,'Athletic'],[18,'Fit'],[25,'Average'],[99,'High']],f:[[14,'Essential fat'],[21,'Athletic'],[25,'Fit'],[32,'Average'],[99,'High']]};
function bfNavy(sex,hCm,neck,waist,hip){
  const I=v=>v/2.54,h=I(hCm);
  if(sex==='f'){if(!(waist>0&&hip>0&&neck>0)||waist+hip-neck<=0)return NaN;return 163.205*Math.log10(I(waist)+I(hip)-I(neck))-97.684*Math.log10(h)-78.387}
  if(!(waist>0&&neck>0)||waist-neck<=0)return NaN;return 86.010*Math.log10(I(waist)-I(neck))-70.041*Math.log10(h)+36.76;
}
const bfBmi=(sex,bmi,age)=>1.2*bmi+.23*age-10.8*(sex==='f'?0:1)-5.4; // Deurenberg
const mifflin=(sex,kg,cm,age)=>10*kg+6.25*cm-5*age+(sex==='f'?-161:5);
const katch=lbm=>370+21.6*lbm;
function calcOut(k){
  const sex=cSex()||'m',age=cAge(),h=cLenCm('c_h'),kg=cKg('c_w');
  const need=[];
  if(k==='bf'){
    if(!(h>0))need.push('height');if(!(kg>0))need.push('weight');
    if(need.length)return cNeed('Add your '+need.join(' and ')+'.');
    const neck=cLenCm('c_neck'),waist=cLenCm('c_waist'),hip=cLenCm('c_hip');
    let bf=bfNavy(sex,h,neck,waist,hip),how='US Navy tape method';
    if(isNaN(bf)){if(!(age>0))return cNeed('Add your age, or fill in neck and waist'+(sex==='f'?' and hips':'')+' for the tape method.');bf=bfBmi(sex,kg/Math.pow(h/100,2),age);how='Estimate from BMI and age (less accurate than the tape)'}
    bf=clamp(bf,2,60);const cat=BFCAT[sex==='f'?'f':'m'].find(c=>bf<=c[0])[1];
    const fat=kg*bf/100,lean=kg-fat;
    S.calcLast={bf:rnd(bf,1)};
    return cRes(`${rnd(bf,1)}<span class="sm mu"> %</span>`,`${cat} · ${how}`,
      `<div class="tiles" style="margin-top:12px"><div class="tile"><div class="lbl">Fat mass</div><div class="sm" style="font-weight:700;margin-top:4px">${cW(fat)}</div></div><div class="tile"><div class="lbl">Lean mass</div><div class="sm" style="font-weight:700;margin-top:4px">${cW(lean)}</div></div></div>
      ${bfBar(bf,sex)}<button class="btn s" style="margin-top:12px" data-act="calcSaveBf">Save ${rnd(bf,1)}% to today's log</button>`);
  }
  if(k==='bmi'){
    if(!(h>0&&kg>0))return cNeed('Add your height and weight.');
    const m=h/100,bmi=kg/(m*m),cat=bmi<18.5?'Underweight':bmi<25?'Healthy':bmi<30?'Overweight':'Obese';
    return cRes(`${rnd(bmi,1)}`,`${cat}`,`<p class="sm" style="margin:10px 0 0">Healthy range for your height: <b>${cW(18.5*m*m)} – ${cW(24.9*m*m)}</b></p><p class="mu xs" style="margin:6px 0 0">BMI does not see muscle. If you lift a lot, body fat % tells you more.</p>`);
  }
  if(k==='ideal'){
    if(!(h>0))return cNeed('Add your height.');
    const over=Math.max(0,h/2.54-60),f=sex==='f';
    const r=[['Devine',(f?45.5:50)+2.3*over],['Robinson',(f?49:52)+(f?1.7:1.9)*over],['Miller',(f?53.1:56.2)+(f?1.36:1.41)*over],['Hamwi',(f?45.5:48)+(f?2.2:2.7)*over]];
    const lo=Math.min(...r.map(x=>x[1])),hi=Math.max(...r.map(x=>x[1]));
    return cRes(`${wv(lo,wu())}–${wv(hi,wu())}<span class="sm mu"> ${wu()}</span>`,'Range across four formulas',`<div style="margin-top:10px">${r.map(([n,v])=>`<div class="setrow"><span>${n}</span><b style="margin-left:auto">${cW(v)}</b></div>`).join('')}</div>`);
  }
  if(k==='tdee'||k==='macro'){
    if(!(h>0&&kg>0&&age>0))return cNeed('Add your age, height and weight.');
    const act=+(document.getElementById('c_act')||{}).value||1.375,bfv=cNum('c_bf');
    const bmr=bfv>0?katch(kg*(1-bfv/100)):mifflin(sex,kg,h,age),tdee=bmr*act;
    if(k==='tdee')return cRes(`${fmtN(Math.round(tdee))}<span class="sm mu"> kcal/day</span>`,`Maintenance · BMR ${fmtN(Math.round(bmr))} kcal (${bfv>0?'Katch-McArdle, uses body fat':'Mifflin-St Jeor'})`,
      `<div style="margin-top:10px">${[['Lose fat (−20%)',tdee*.8],['Lose slowly (−10%)',tdee*.9],['Maintain',tdee],['Lean gain (+10%)',tdee*1.1]].map(([n,v])=>`<div class="setrow"><span>${n}</span><b style="margin-left:auto">${fmtN(Math.round(v/10)*10)} kcal</b></div>`).join('')}</div>`);
    const g=S.calcGoal||'keep',kcal=Math.round((g==='lose'?tdee*.8:g==='gain'?tdee*1.1:tdee)/10)*10;
    const lean=bfv>0?kg*(1-bfv/100):null,p=Math.round(lean?lean*(g==='lose'?2.4:2.2):kg*(g==='lose'?2:g==='gain'?1.8:1.6)),f=Math.round(kcal*.25/9),c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
    const tot=p*4+f*9+c*4||1;
    return cRes(`${fmtN(kcal)}<span class="sm mu"> kcal/day</span>`,`${g==='lose'?'Lose fat':g==='gain'?'Build muscle':'Maintain'}`,
      `<div class="mbar" style="margin-top:12px"><i style="width:${p*4/tot*100}%;background:var(--acc)"></i><i style="width:${f*9/tot*100}%;background:var(--acc2)"></i><i style="width:${c*4/tot*100}%;background:var(--mu)"></i></div>
      <div style="margin-top:8px">${[['Protein',p,'var(--acc)'],['Fat',f,'var(--acc2)'],['Carbs',c,'var(--mu)']].map(([n,v,col])=>`<div class="setrow"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${col};margin-right:8px"></i>${n}</span><b style="margin-left:auto">${v} g</b></div>`).join('')}</div>
      ${typeof V2!=='undefined'&&V2.nut?`<button class="btn s" style="margin-top:12px" data-act="calcUseNut" data-a="${kcal}">Use ${fmtN(kcal)} kcal as my food target</button>`:''}`);
  }
  if(k==='prot'){
    if(!(kg>0))return cNeed('Add your weight.');
    const g=(document.getElementById('c_pg')||{}).value||'gain',[a,b]=g==='keep'?[1.0,1.2]:g==='lose'?[1.8,2.4]:[1.6,2.2];
    return cRes(`${Math.round(kg*a)}–${Math.round(kg*b)}<span class="sm mu"> g/day</span>`,`${a}–${b} g per kg of body weight`,`<p class="mu xs" style="margin:8px 0 0">Spread it over 3–5 meals of about ${Math.round(kg*.4)} g each.</p>`);
  }
  if(k==='water'){
    if(!(kg>0))return cNeed('Add your weight.');
    const min=cNum('c_min')||0,ml=kg*35+min/30*350;
    return cRes(`${rnd(ml/1000,1)}<span class="sm mu"> litres</span>`,`About ${Math.round(ml/250)} glasses of 250 ml`,`<p class="mu xs" style="margin:8px 0 0">Drink more in hot weather. Pale yellow pee means you are on track.</p>`);
  }
  if(k==='orm'){
    const w=cKg('c_lw'),r=cNum('c_reps');
    if(!(w>0&&r>0))return cNeed('Enter a weight and the reps you did with it.');
    if(r>12)return cNeed('Use a set of 12 reps or fewer for a good estimate.');
    const ep=w*(1+r/30),br=w*36/(37-r),m=r===1?w:(ep+br)/2;
    const pct=[[100,1],[95,2],[90,4],[85,6],[80,8],[75,10],[70,12],[65,15],[60,20]];
    return cRes(`${wv(m,wu())}<span class="sm mu"> ${wu()}</span>`,`Estimated one-rep max (Epley ${wv(ep,wu())} · Brzycki ${wv(br,wu())})`,
      `<div style="margin-top:10px">${pct.map(([p,rr])=>`<div class="setrow"><span>${p}%</span><span class="mu sm" style="margin-left:10px">about ${rr} rep${rr>1?'s':''}</span><b style="margin-left:auto">${cW(m*p/100)}</b></div>`).join('')}</div>`);
  }
  if(k==='hr'){
    if(!(age>0))return cNeed('Add your age.');
    const max=Math.round(208-.7*age),rhr=cNum('c_rhr'),kv=rhr>30&&rhr<120;
    const Z=[[1,'Recovery',.5,.6],[2,'Fat burn / base',.6,.7],[3,'Aerobic',.7,.8],[4,'Threshold',.8,.9],[5,'Max effort',.9,1]];
    const bpm=p=>Math.round(kv?rhr+(max-rhr)*p:max*p);
    return cRes(`${max}<span class="sm mu"> bpm max</span>`,kv?`Karvonen method with resting ${rhr} bpm`:'Add resting heart rate for more personal zones',
      `<div style="margin-top:10px">${Z.map(([n,l,a,b])=>`<div class="setrow"><span><b style="margin-right:8px">Z${n}</b>${l}</span><b style="margin-left:auto">${bpm(a)}–${bpm(b)}</b></div>`).join('')}</div>`);
  }
  if(k==='burn'){
    if(!(kg>0))return cNeed('Add your weight.');
    const a=(document.getElementById('c_actv')||{}).value||'Walking',min=cNum('c_dur')||0,met=metOf(a)*(INT[S.calcInt||'mod']||1),kcal=Math.round(met*kg*min/60);
    return cRes(`${fmtN(kcal)}<span class="sm mu"> kcal</span>`,`${a}, ${min} min · ${rnd(met,1)} MET`,`<button class="btn s" style="margin-top:12px" data-act="tab" data-a="act">Log an activity</button>`);
  }
  if(k==='whtr'){
    const w=cLenCm('c_waist');if(!(h>0&&w>0))return cNeed('Add your height and waist.');
    const r=w/h,cat=r<.4?'Low':r<.5?'Healthy':r<.6?'Raised risk':'High risk';

}
function bfBar(bf,sex){

  return`<div class="bfbar" style="margin-top:12px">${seg}<b style="left:${Math.min(98,bf/max*100)}%"></b></div><div class="row sp xs mu" style="margin-top:4px"><span>Lean</span><span>High</span></div>`;
}
function calcCard(k,t,d){
  const open=S.calcOpen===k;
  return`<div class="card calc${open?' open':''}"><button class="calc-h" data-act="calcOpen" data-a="${k}"><div style="text-align:left"><div style="font-weight:700">${t}</div><div class="mu sm">${d}</div></div><span class="chev">${open?'−':'+'}</span></button>
  ${open?`<div class="calc-b">${calcForm(k)}<div id="c_out">${calcOut(k)}</div></div>`:''}</div>`;
}
V2.calc=()=>`<h2>Calculators</h2>${CALC.map(c=>calcCard(...c)).join('')}<p class="mu xs" style="margin-top:6px">Estimates for guidance, not medical advice.</p>`;
function calcRefresh(){const o=document.getElementById('c_out');if(o)o.innerHTML=calcOut(S.calcOpen)}
Object.assign(I,{calc(){calcRefresh()}});
Object.assign(CH,{calcSel(){calcRefresh()}});
Object.assign(A,{
  calcOpen(k){S.calcOpen=S.calcOpen===k?null:k;render()},
  calcGoal(g){S.calcGoal=g;document.querySelectorAll('#c_goal button').forEach(b=>b.classList.toggle('on',b.dataset.a===g));calcRefresh()},
  calcInt(g){S.calcInt=g;document.querySelectorAll('[data-act=calcInt]').forEach(b=>b.classList.toggle('on',b.dataset.a===g));calcRefresh()},
  calcSaveBf(){
    const bf=S.calcLast&&S.calcLast.bf,lw=latestW(),kg=cKg('c_w')||(lw&&lw.kg);if(!bf||!kg)return;
    addWeight({d:today(),kg:rnd(kg,3),bf});toast('Saved '+bf+'% body fat');

/* ================= RECOVERY CODE (v2.5) =================
   Workouts are encrypted with a key made from the password, so a forgotten password cannot be emailed or
   reset by the server. Instead a random recovery code protects a copy of the data key and the sign-in
   secret. The copy lives at recov/<hash of code>, readable only by someone who already has the code.
   The code also names the account, so it finds a forgotten username too. Resetting swaps the password
   but keeps the same data key, so nothing has to be re-encrypted. */
const RK_AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',RK_IT=100000;
const rkNorm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const rkFmt=c=>c.match(/.{1,5}/g).join('-');
function rkGen(){const b=crypto.getRandomValues(new Uint8Array(20));let s='';for(const x of b)s+=RK_AL[x&31];return s}
async function rkId(code){const h=await crypto.subtle.digest('SHA-256',enc.encode('legacy-rec|'+code));return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}
const rkImport=jwk=>crypto.subtle.importKey('jwk',jwk,{name:'AES-GCM'},true,['encrypt','decrypt']);
const rkOk=()=>!!(DB&&DB.auth);

/* make (or replace) the account's recovery code. dataKey = the key that encrypts the workouts. */
async function rkCreate(u,dataKey,fp){
  const code=rkGen(),salt=crypto.getRandomValues(new Uint8Array(16)),rk=await deriveKey(code,salt,RK_IT);
  const jwk=await crypto.subtle.exportKey('jwk',dataKey),id=await rkId(code);
  const sealed=await seal(rk,{u,k:jwk,fp});
  await DB.doc('recov/'+id).set(Object.assign({salt:b64(salt),it:RK_IT},sealed));
  const ref=DB.doc('accts/'+u),a=await ref.get(),old=a.exists?a.data():null;
  if(old){
    if(old.rid&&old.rid!==id){try{await DB.doc('recov/'+old.rid).delete()}catch(e){}}
    await ref.set(Object.assign({},old,{rid:id}));
  }
  return rkFmt(code);
}
/* find and open a recovery record from what the person typed */
async function rkOpen(raw){
  const code=rkNorm(raw);if(code.length!==20)throw new Error('bad');
  const id=await rkId(code),d=await DB.doc('recov/'+id).get();
  if(!d.exists)throw new Error('bad');
  const r=d.data(),rk=await deriveKey(code,unb64(r.salt),r.it||RK_IT),p=await open(rk,{iv:r.iv,ct:r.ct});
  return{id,r,rk,p};
}

/* how-to steps for the main exercises, by movement */
const HOW={
 squat:['Stand with your feet about shoulder-width apart, chest tall, core tight.','Push your hips back and bend your knees until your thighs are about parallel to the floor.','Press through your whole foot to stand. Keep your knees in line with your toes.'],

 lunge:['Stand tall with your feet hip-width apart.','Step forward (or back) and lower until both knees are about 90 degrees.','Push through your front foot to return. Keep your front knee over your ankle.'],
 push:['Set your hands slightly wider than your shoulders and make your body one straight line.','Lower your chest toward the floor, elbows about 45 degrees from your body.','Press the floor away until your arms are straight. Do not let your hips sag.'],
 press:['Hold the weight at shoulder height, core tight, ribs down.','Press straight up until your arms are fully extended beside your ears.','Lower under control to your shoulders. Do not lean back.'],
 pull:['Hinge forward with a flat back and let the weight hang with straight arms.','Pull your elbows back toward your hips and squeeze your shoulder blades together.','Lower slowly until your arms are straight again. Keep your neck neutral.'],
 curl:['Stand tall with the weight in your hands, elbows tucked to your sides.','Curl the weight up toward your shoulders without swinging.','Lower slowly to a full stretch. Keep your elbows still.'],
 vpull:['Grip the bar slightly wider than your shoulders and hang with your shoulders down.','Pull your elbows down toward your ribs until your chin is over the bar.','Lower slowly to a full hang. Avoid swinging.'],
 plank:['Place your forearms or hands under your shoulders and make a straight line from head to heels.','Squeeze your glutes and brace your stomach as if about to be tapped.','Keep breathing. Stop if your lower back sags.'],
 crunch:['Lie on your back with your knees bent and your lower back pressed to the floor.','Curl your ribs toward your hips, lifting your shoulder blades off the floor.','Lower slowly. Do not pull on your neck.'],
 bridge:['Lie on your back with your knees bent and feet flat, hip-width apart.','Press through your heels and lift your hips until your body is a straight line.','Squeeze your glutes at the top, then lower slowly.'],
 jj:['Stay light on the balls of your feet.','Move at a steady pace you can keep for the whole set.','Land softly and breathe in rhythm.'],
 hknee:['Stand tall with your core braced.','Drive your knees up quickly, pumping your arms.','Stay light and breathe steadily.']
};
function rtMeta(key){
  const [sec,id]=key.split(':');
  if(sec==='wu'||sec==='cd'){const d=(sec==='wu'?WU:CD)[id];return d&&{name:d.n,an:d.an,steps:d.st,tip:'',eq:false,sec,id,d}}
  const e=BYID[+id]||BYID[id];if(!e)return null;
  const an=glFor(e),h=HOW[an]||HOW[typeof patternOf==='function'?patternOf(e):'squat']||HOW.squat;
  return{name:e.name,an,steps:h,tip:e.tip||'',eq:e.eq.some(x=>['db','kb','bb'].includes(x)),sec:'main',id:e.id,e};
}

/* ================= ROUTINE FLOW (v2.6): overview you can edit, then a full-screen guided player =================
   Warm up -> main workout -> cool down, every move with an animated glyph and how-to steps. */
const RT_SEC={wu:'Warm up',main:'Main workout',cd:'Cool down'};
const rtU=a=>[...new Set(a)];
function rtMus(){return new Set(((S.sess&&S.sess.exs)||[]).map(x=>BYID[x]&&BYID[x].m).filter(Boolean))}
/* a sensible warm-up and cool-down for whatever muscles today's workout uses (or the person's saved version) */
function rtAuto(){
  const sv=S.profile&&S.profile.rtd;
  if(sv&&sv.wu&&sv.cd)return{wu:sv.wu.filter(m=>WU[m.id]).map(m=>({id:m.id,amt:m.amt})),cd:sv.cd.filter(m=>CD[m.id]).map(m=>({id:m.id,amt:m.amt}))};
  const ms=rtMus(),up=['CH','BK','SH','BI','TR'].some(m=>ms.has(m)),lo=['QD','GH','CF'].some(m=>ms.has(m)),co=ms.has('CO'),fb=ms.has('FB')||ms.has('CA'),beg=LVL()==='beginner';
  const wu=[{id:'march',amt:beg?40:30},{id:'armc',amt:14}];
  if(lo||fb)wu.push({id:'hinge',amt:10},{id:'squat',amt:10});
  if(lo&&!beg)wu.push({id:'legsw',amt:20});
  if(up)wu.push({id:'sroll',amt:12},{id:'twist',amt:16});
  if(co&&!lo)wu.push({id:'cat',amt:8});
  if(fb||!beg&&(lo||up))wu.push({id:'jj',amt:30});
  const cd=[{id:'breath',amt:30}];
  if(lo||fb)cd.push({id:'quad',amt:30},{id:'ham',amt:30},{id:'hipf',amt:30});
  if(up)cd.push({id:'chest',amt:30},{id:'cross',amt:25},{id:'tri',amt:25});
  if(co&&cd.length<5)cd.push({id:'side',amt:30});
  cd.push({id:'child',amt:40});
  const uq=a=>a.filter((m,i)=>a.findIndex(x=>x.id===m.id)===i);
  return{wu:uq(wu).slice(0,7),cd:uq(cd).slice(0,7)};
}
function rtExpand(out,sec,d,m){if(!d)return;(d.sd?['L','R']:[null]).forEach(sd=>out.push({sec,id:m.id,k:d.k,amt:m.amt,side:sd,n:1,of:1}))}
function rtSteps(){
  const g=S.gd,o=g.opt,out=[];
  if(o.wu)g.plan.wu.forEach(m=>rtExpand(out,'wu',WU[m.id],m));
  gdSteps().forEach(s=>{s.sec='main';out.push(s)});
  if(o.cd)g.plan.cd.forEach(m=>rtExpand(out,'cd',CD[m.id],m));
  return out;
}
const rtKey=st=>st.sec==='main'?'ex:'+st.x:st.sec+':'+st.id;
function rtName(st){
  if(st.sec==='main')return gdName(st.x);
  const d=(st.sec==='wu'?WU:CD)[st.id];return(d?d.n:'')+(st.side?(st.side==='L'?' (left)':' (right)'):'');
}
const rtMin=s=>Math.max(1,Math.round(s/60));
function rtEstSec(){
  const g=S.gd;let t=0,prev=null;
  g.steps.forEach((st,i)=>{
    if(!prev||prev.sec!==st.sec)t+=g.opt.ready;
    else t+=(prev.sec==='main'?g.opt.rest:g.opt.restLite);
    t+=st.sec==='main'?(gdWorkMs(st)/1000||40):(st.k==='t'?st.amt:st.amt*3);
    prev=st;
  });
  return t;
}
gdEst=function(){return rtMin(rtEstSec())};
gdWorkMs=function(st){
  if(st.sec&&st.sec!=='main')return st.k==='t'?st.amt*1000:0;
  const e=BYID[st.x],g=S.gd;if(e.k==='t')return draftFor(st.x).d*1000;return g.opt.style==='timed'?g.opt.workSec*1000:0;
};
gdGo=function(ph){
  const g=S.gd,now=Date.now(),st=g.steps[g.i],pv=g.steps[g.i-1],nm=rtName(st);
  g.ph=ph;g.run=true;g.lb=-1;g.half=false;g.pw=0;
  if(ph==='ready'){
    g.dur=g.opt.ready*1000;g.end=now+g.dur;
    const intro=(!pv||pv.sec!==st.sec)?RT_SEC[st.sec]+'. ':'';
    gdSay(intro+'Get ready. '+nm);
  }else if(ph==='work'){
    g.dur=gdWorkMs(st);g.end=g.dur?now+g.dur:0;g.ws=now;beep(1040,.25);buzz(60);gdSay(st.side?(st.side==='L'?'Left side. Go':'Right side. Go'):'Go');
  }else if(ph==='rest'){
    const rs=st.sec==='main'?g.opt.rest:g.opt.restLite;g.dur=rs*1000;g.end=now+g.dur;const nx=g.steps[g.i+1];gdSay('Rest.'+(nx?' Next: '+rtName(nx):''));
  }
  render();
};
gdAfterWork=function(log){
  const g=S.gd,st=g.steps[g.i];if(log&&st.sec==='main')gdLog(st);
  const nx=g.steps[g.i+1];
  if(!nx){gdFinishPhase();return}
  if(nx.sec!==st.sec){g.i++;gdGo('ready');return}
  gdGo('rest');
};

/* ---------- open: overview first ---------- */
A.gdOpen=function(){
  if(S.gd)return;
  const s=S.sess;if(!s||!s.exs.length){toast('Add exercises first');return}
  T=null;
  const o=Object.assign({ready:10,rest:gdRestDef(),restLite:8,style:'tap',workSec:30,voice:true,wu:true,cd:true,how:LVL()==='beginner'},S.profile.gd||{});
  S.gd={ph:'overview',opt:o,plan:rtAuto(),ed:false,optOpen:false,steps:[],i:0,t0:0,paused:0,run:false};
  S.gd.steps=rtSteps();render();
};
A.gdStart=function(){
  const g=S.gd;S.profile.gd=Object.assign({},g.opt);saveProfile();g.steps=rtSteps();
  if(!g.steps.length){toast('Nothing to do yet');return}
  ensureAudio();try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{S.gdLock=l}).catch(()=>{})}catch(e){}
  g.t0=Date.now();g.paused=0;g.i=0;g.ed=false;gdGo('ready');
};
A.gdSkip=function(){
  const g=S.gd;if(!g)return;
  if(g.ph==='ready')gdGo('work');
  else if(g.ph==='rest'){g.i++;gdGo('work')}
  else if(g.ph==='work'){const st=g.steps[g.i],nx=g.steps[g.i+1];if(!nx)gdFinishPhase();else{g.i++;gdGo(nx.sec!==st.sec?'ready':'work')}}
};
A.gdPrev=function(){
  const g=S.gd;if(!g)return;
  if(g.ph==='rest'){gdUnlog(g.steps[g.i]);gdGo('work')}
  else{if(g.i>0)g.i--;gdUnlog(g.steps[g.i]);gdGo('work')}
};
{const _q=A.gdQuitDo;A.gdQuitDo=function(){const had=S.gd&&S.gd.ph==='overview';_q.apply(this,arguments);if(had&&S.tourAfter&&!S.tour){S.tour=S.tourAfter;S.tourAfter=null;render()}}}
Object.assign(A,{
  rtEdit(){S.gd.ed=!S.gd.ed;render()},
  rtOptTog(){S.gd.optOpen=!S.gd.optOpen;render()},
  rtFlag(a){const g=S.gd;g.opt[a]=!g.opt[a];g.steps=rtSteps();render()},
  rtHowTog(){const g=S.gd;g.opt.how=!g.opt.how;render()},
  rtHow(a){S.modal={type:'rttut',key:a};render()},
  rtMv(a,b){
    const g=S.gd,[sec,i]=a.split(':'),k=+i,d=+b;
    if(sec==='main'){const ex=S.sess.exs,j=k+d;if(j<0||j>=ex.length)return;[ex[k],ex[j]]=[ex[j],ex[k]];saveActive()}
    else{const L=g.plan[sec],j=k+d;if(j<0||j>=L.length)return;[L[k],L[j]]=[L[j],L[k]]}
    g.steps=rtSteps();render();
  },
  rtDel(a){
    const g=S.gd,[sec,i]=a.split(':'),k=+i;
    if(sec==='main'){if(S.sess.exs.length<=1){toast('Keep at least one exercise');return}S.sess.exs.splice(k,1);saveActive()}
    else g.plan[sec].splice(k,1);
    g.steps=rtSteps();render();
  },
  rtAmt(a,b){
    const g=S.gd,[sec,i]=a.split(':'),k=+i,d=+b;
    if(sec==='main'){const x=S.sess.exs[k],e=BYID[x],dr=draftFor(x);if(e.k==='t')dr.d=Math.max(5,(dr.d||30)+d*5);else dr.r=Math.max(1,(dr.r||10)+d);saveActive()}
    else{const m=g.plan[sec][k],dd=(sec==='wu'?WU:CD)[m.id];m.amt=Math.max(dd.k==='t'?5:2,m.amt+d*(dd.k==='t'?5:2))}
    g.steps=rtSteps();render();
  },
  rtSwap(a){S.modal={type:'rtswap',key:a};render()},
  rtPick(a,b){
    const g=S.gd,[sec,i]=a.split(':'),k=+i;
    if(sec==='main'){S.sess.exs[k]=+b||b;saveActive()}
    else{const m=g.plan[sec][k],dd=(sec==='wu'?WU:CD)[b];g.plan[sec][k]={id:b,amt:dd.amt}}
    S.modal=null;g.steps=rtSteps();render();
  },
  rtAdd(sec){S.modal={type:'rtadd',sec,m:null};render()},
  rtAddM(m){S.modal=Object.assign({},S.modal,{m});render()},
  rtAddPick(sec,id){
    const g=S.gd;
    if(sec==='main'){const x=+id||id;if(!S.sess.exs.includes(x))S.sess.exs.push(x);saveActive()}
    else{const dd=(sec==='wu'?WU:CD)[id];g.plan[sec].push({id,amt:dd.amt})}
    S.modal=null;g.steps=rtSteps();render();
  },
  rtSaveDef(){S.profile.rtd={wu:S.gd.plan.wu.map(m=>({id:m.id,amt:m.amt})),cd:S.gd.plan.cd.map(m=>({id:m.id,amt:m.amt}))};saveProfile();toast('Saved as your default warm-up and cool-down')},
  rtResetDef(){delete S.profile.rtd;saveProfile();S.gd.plan=rtAuto();S.gd.steps=rtSteps();toast('Back to the automatic warm-up and cool-down');render()}
});

MODALS2.rtswap=m=>{

/* ---- never leave a blank or stuck screen: extras fall back to the plain view, render failures show a way out ---- */
function SAFE(cur,base,tag){return function(){try{return cur.apply(this,arguments)}catch(e){console.error(tag,e);noteErr(tag,e);return base.apply(this,arguments)}}}
const ERRS=[];function noteErr(tag,e){ERRS.push(tag+': '+String(e&&(e.message||e)).slice(0,140));if(ERRS.length>8)ERRS.shift()}
viewOf=SAFE(viewOf,_vo,'view');modalHtml=SAFE(modalHtml,_mh,'modal');wxCard=SAFE(wxCard,_wx,'exercise');wkView=SAFE(wkView,_wkv,'workout');
tmView=SAFE(tmView,_tmv,'timer');homeView=SAFE(homeView,_hv,'home');trainView=SAFE(trainView,_tv,'train');meView=SAFE(meView,_mev,'you');

  }}}
const T_BOOT=Date.now();
function showErr(m){
  if(S.errShown||/ResizeObserver|Script error/.test(m))return;
  if(S.loaded&&Date.now()-T_BOOT>20000&&!/^load|render|screen/.test(m))return;
  S.errShown=1;const b=document.createElement('div');b.id='errbar';
  b.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:999;background:#b3261e;color:#fff;padding:10px;font:12px/1.4 monospace;white-space:pre-wrap;max-height:45vh;overflow:auto';
  b.textContent='Legacy hit a problem. Please screenshot this and send it:\n'+String(m).slice(0,700);b.onclick=()=>b.remove();document.body.appendChild(b);
}
window.addEventListener('error',e=>showErr((e.message||'error')+' @'+(e.lineno||'')+':'+(e.colno||'')));
window.addEventListener('unhandledrejection',e=>{const r=e.reason;showErr(String(r&&(r.stack||r.message)||r))});
buildSky();applySky();
