<style>

<script>
(()=>{
'use strict';
/* ================= EXERCISE LIBRARY ================= */
const EQ={bw:'Bodyweight',db:'Dumbbells',kb:'Kettlebell',bb:'Barbell',bn:'Bench',pu:'Pull-up bar',mc:'Machines',cb:'Cables',bd:'Bands'};
const EQD={bw:'No equipment needed',db:'Different weights',kb:'Different weights',bb:'Bar, plates, rack',bn:'Flat or adjustable',pu:'Doorway bar or rig',mc:'Leg press, chest press…',cb:'Pulley station',bd:'Loops or tubes'};
const MU={CH:'Chest',BK:'Back',SH:'Shoulders',BI:'Biceps',TR:'Triceps',QD:'Quads',GH:'Glutes & Hams',CF:'Calves',CO:'Core',FB:'Full Body',CA:'Cardio'};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const RAW=`Push-Up|CH|bw|r|Hands just wider than shoulders, body in one straight line. Lower your chest to a fist above the floor, then press away.|i9sTjhN4Z3M
Knee Push-Up|CH|bw|r|Keep a straight line from knees to head. Lower with control, press up. Great stepping stone to full push-ups.|6DFAEphpiE0
Incline Push-Up|CH|bw|r|Hands on a sturdy counter or bench. Keep your body rigid and your elbows about 45 degrees from your sides.|y8I66lWtNB8

/* ---------- persistence ---------- */
function persist(id,get){
  if(!col||!KEY)return;
  const w=W[id]||(W[id]={busy:false,dirty:false});
  w.get=get;
  if(w.busy){w.dirty=true;return}
  w.busy=true;setSync('saving');
  (async()=>{
    let ok=true;
    do{
      w.dirty=false;
      try{const sealed=await seal(KEY,w.get());await col.doc(S.user+':'+id).set(Object.assign({u:S.user},sealed))}catch(e){ok=false;console.error('save failed',e)}
    }while(w.dirty);
    w.busy=false;setSync(ok?'saved':'error');

async function deriveFb(u,pw){const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode('legacy-fb:'+u),iterations:200000,hash:'SHA-256'},km,256);return b64(new Uint8Array(bits))}
async function submitAuth(mode){
  const u=normU($('#a_u').value),pw=$('#a_p').value,up=mode==='up',btn=$('#a_go');
  const fail=m=>authScreen(mode,m,u);
  if(!U_OK.test(u))return fail('Username must be 3–20 letters, numbers, dots, dashes or underscores.');
  if(pw.length<6)return fail('Password must be at least 6 characters.');
  if(up&&pw!==$('#a_p2').value)return fail('Passwords do not match.');
  const rm=$('#a_rm').checked;btn.disabled=true;btn.textContent='One moment…';
  try{
    const ref=DB.doc('accts/'+u),A=DB.auth;
    let key,snap=null;
    if(A){
      const fp=await deriveFb(u,pw);
      if(up){
        try{await A.signUp(u,fp)}
        catch(e){
          if(e&&e.code==='auth/email-already-in-use'){
            /* an earlier sign-up may have stopped halfway: finish it only if it is truly empty */
            let ok=false;try{await A.signIn(u,fp);ok=!(await ref.get()).exists}catch(e2){}
            if(!ok)return fail('That username is taken. Try another.');

      }else{
        try{await A.signIn(u,fp)}

        snap=await ref.get();
        if(!snap.exists)return fail('This account was not finished setting up. Create it again with the same username and password.');
      }
    }else snap=await ref.get();
    if(up){
      if(snap&&snap.exists)return fail('That username is taken. Try another.');
      const salt=crypto.getRandomValues(new Uint8Array(16));
      key=await deriveKey(pw,salt,IT);
      await ref.set({salt:b64(salt),it:IT,chk:await seal(key,{ok:'legacy'})});
    }else{
      if(!snap.exists)return fail('No account with that username.');
      const a=snap.data();key=await deriveKey(pw,unb64(a.salt),a.it||IT);
      try{await open(key,a.chk)}catch(e){return fail('Wrong password.')}
    }

    enter(u,key);
  }catch(e){console.error(e);fail('Something went wrong. Check your connection and try again.'+(e&&(e.code||e.message)?' ['+String(e.code||e.message).slice(0,90)+']':''))}
}

    for(;i<ph.length;i++){if(el<acc+ph[i].d*1000)break;acc+=ph[i].d*1000}
    if(i>=ph.length)return{ms:0,frac:1,phase:'Done',sub:'Great work',tone:'ok',idx:i,done:true};
    const p=ph[i],left=acc+p.d*1000-el;
    return{ms:left,frac:1-left/(p.d*1000),phase:p.n,sub:p.r?'Round '+p.r+' of '+T.cfg.rounds+' · '+mmss(T.total-el)+' left':'',tone:p.k,idx:i,done:false};

function weightHtml(x,d,m){

/* ---------- progress ---------- */
function lineChart(pts,goal,u){
  if(pts.length<2)return`<div class="empty">Log at least two weigh-ins to see your trend.</div>`;
  const Wd=600,H=220,pl=44,pr=14,pt=14,pb=28;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  if(goal!=null){lo=Math.min(lo,goal);hi=Math.max(hi,goal)}
  const pad=Math.max((hi-lo)*.2,.6);lo-=pad;hi+=pad;
  const x0=pts[0].t,x1=pts[pts.length-1].t||x0+1;
  const X=t=>pl+(t-x0)/((x1-x0)||1)*(Wd-pl-pr),Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  const line=pts.map(p=>X(p.t).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ');
  const area=`${X(x0)},${H-pb} ${line} ${X(x1)},${H-pb}`;
  const ticks=[0,1,2,3].map(i=>lo+(hi-lo)*i/3);
  return`<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="Weight over time">
  ${ticks.map(v=>`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mu)">${rnd(v,1)}</text>`).join('')}
  ${goal!=null?`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--ok)" stroke-dasharray="6 5"/><text x="${Wd-pr}" y="${Y(goal)-5}" text-anchor="end" font-size="11" fill="var(--ok)">Goal ${rnd(goal,1)}</text>`:''}
  <polygon points="${area}" fill="var(--acc)" opacity=".16"/><polyline points="${line}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.length<=60?pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3.5" fill="var(--panel-s)" stroke="var(--acc)" stroke-width="2"/>`).join(''):''}
  <text x="${pl}" y="${H-8}" font-size="11" fill="var(--mu)">${dlabel(dkey(x0))}</text><text x="${Wd-pr}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--mu)">${dlabel(dkey(x1))}</text></svg>`;
}
function weekBars(){
  const ws=weekStart(Date.now()),n=8,counts=[];
  for(let i=n-1;i>=0;i--){const a=ws-i*7*864e5,b=a+7*864e5;counts.push({a,c:allSessions().filter(s=>s.s>=a&&s.s<b).length})}
  const mx=Math.max(3,...counts.map(c=>c.c)),bw=50,Wd=n*bw+10,H=130;
  return`<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="Workouts per week">${counts.map((c,i)=>{const h=c.c/mx*80;return`<rect x="${i*bw+10}" y="${100-h}" width="34" height="${Math.max(h,2)}" rx="6" fill="${i===n-1?'var(--acc)':'var(--mu)'}"/><text x="${i*bw+27}" y="${94-h}" text-anchor="middle" font-size="12" fill="var(--tx)">${c.c||''}</text><text x="${i*bw+27}" y="118" text-anchor="middle" font-size="10" fill="var(--mu)">${dlabel(dkey(c.a))}</text>`}).join('')}</svg>`;
}
function prView(){

function trainView(){
  const u=unit(),ss=allSessions();
  if(!ss.length)return`<div class="empty">No workouts logged yet.<br><br><button class="btn" data-act="tab" data-a="wk">Start your first workout</button></div>`;
  const sets=ss.flatMap(s=>s.sets),reps=sets.reduce((a,t)=>a+(t.r||0),0),vol=volumeKg(sets);
  const best={};
  sets.forEach(t=>{const ex=BYID[t.x];if(!ex)return;const b=best[t.x]||(best[t.x]={n:0,top:null});b.n++;
    const key=t.w?toKg(t.w,t.u)*1000+(t.r||0):(ex.k==='t'?(t.d||0):(t.r||0));
    if(!b.top||key>b.top.key)b.top={key,t}});
  const pbs=Object.entries(best).sort((a,b)=>b[1].n-a[1].n).slice(0,8);
  return`<div class="tiles"><div class="tile"><div class="lbl">Workouts</div><div class="big">${ss.length}</div></div><div class="tile"><div class="lbl">Sets</div><div class="big">${fmtN(sets.length)}</div></div><div class="tile"><div class="lbl">Total reps</div><div class="big">${fmtN(reps)}</div></div><div class="tile"><div class="lbl">Lifted (${u})</div><div class="big">${fmtN(fromKg(vol,u))}</div></div></div>

  <div class="card"><div class="lbl" style="margin-bottom:8px">Personal bests</div>${pbs.map(([x,b])=>`<div class="setrow"><span>${esc(BYID[x].name)}</span><b style="margin:0">${esc(setText(b.top.t))}</b></div>`).join('')}</div>
  <h2>History</h2>${ss.slice(0,40).map(sessCard).join('')}`;
}

  const o=S.legacy?JSON.parse(JSON.stringify(S.legacy)):null;S.modal=null;if(!o)return render();
  S.profile=normP(o.profile);S.weights=o.weights;S.logs=o.logs;S.todayEq=(o.profile.equip||['bw']).slice();
  saveProfile();saveWeights();Object.keys(o.logs).forEach(saveMonth);S.legacy=null;toast('Imported');render();
 }
};
const CH={
 split(v){const x=SPLITS[v];if(x&&x.wk&&$('#f_wk'))$('#f_wk').value=String(x.wk)},
 recago(v){S.R.ago=+v},
 hu(v){syncForm();S.P.hUnit=v;render()},
 wu(v){syncForm();S.P.wUnit=v;render()},
 gu(v){syncForm();S.P.gUnit=v;if(S.profile)S.P.wUnit=v;render()},
 lu(v){syncForm();const P=S.P;P.lUnit=v;P.dbW=DEF[v].db.slice();P.kbW=DEF[v].kb.slice();['db','kb','bb'].forEach(m=>{if(P.adj[m])P.adj[m]=Object.assign({},ADJDEF[v][m])});render()},
 wiu(v,a,el){const inp=$('#'+a),prev=el.dataset.prev||wu();if(inp&&inp.value!==''&&!isNaN(parseFloat(inp.value)))inp.value=String(rnd(parseFloat(inp.value)*WF[prev]/WF[v],v==='g'?0:2));el.dataset.prev=v;if(S.profile&&S.profile.wUnit!==v){S.profile.wUnit=v;saveProfile()}},
 adjf(){syncForm();render()},
 wsu(v,a,el){const inp=$('#'+a),prev=el.dataset.prev||waistU();if(inp&&inp.value!==''&&!isNaN(parseFloat(inp.value)))inp.value=String(rnd(parseFloat(inp.value)*HF[prev]/HF[v],2));el.dataset.prev=v}
};
const I={
 fprev(){updatePreview()},
 rnotes(v){S.R.notes=v},
 cknote(v){S.K.note=v},
 dnote(v,a){const P=S.profile;P.dn=P.dn||{};if(v.trim())P.dn[a]=v;else delete P.dn[a];const ks=Object.keys(P.dn).sort();while(ks.length>150)delete P.dn[ks.shift()];saveProfile()},
 q(v){S.filter.q=v;S.filter.lim=60;$('#exlist').innerHTML=listHtml()},
 dw(v,a){draftFor(a).w=parseFloat(v)||0;saveActive()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=A[el.dataset.act];if(f){if(el.tagName==='A'||(el.classList.contains('modal')&&e.target!==el))return;f(el.dataset.a,el.dataset.b,el)}
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el.value,el.dataset.a,el)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&I[el.dataset.in])I[el.dataset.in](el.value,el.dataset.a,el)});
window.addEventListener('beforeunload',()=>{try{unsub&&unsub()}catch(e){}});

buildSky();applySky();setInterval(applySky,30000);
init();
})();
</script>
